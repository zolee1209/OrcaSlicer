    owned_files: []
    hooks: [src/OrcaSlicer.cpp, src/libslic3r/PrintConfig.cpp]
    cli: [--filament-colour]
    config: [filament_colour (CLIMisc)]
    commits: [db43e2bb85, cdea9ce03d]
    upstream_equivalent: "részben: #15636 (GUI mixed filament szabályok CLI-ben), #15639, #16157, #16247"
    decision: "2026-10-13: mindenképp a miénk marad."
    used_by: [routes/api_routes.py run_machine_process (--filament-colour)]
    test: null
    notes: >
      Tartalma: extruder_type / nozzle_volume_type szintézis, ha a gépprofil nem adja meg
      (DynamicPrintConfig::update_values_to_printer_extruders_for_multiple_filaments);
      printer_extruder_id / printer_extruder_variant alapértékek + set_num_extruders a CLI-ben;
      helykitöltő filament-színek, ha nincs megadva; per-filament vektorok átméretezése
      (filament_is_support, *_retraction_distances_when_cut, *_long_retractions_when_cut).
      Rebase után ellenőrizni kell, melyik részt fedi le már az upstream.

