# Saját fork-funkciók nyilvántartása (zolee1209/OrcaSlicer).
# Ez az egyetlen hiteles forrás: kódcímke-ellenőrzés, rebase-felülvizsgálat és upstream-beadás innen indul.
#
# Mezők:
#   id                  egyedi azonosító; a kódban // FORK(<id>) címke, commit-tárgyban [fork:<id>] előtag
#   name                rövid leírás
#   status              fork-only | superseded | dropped
#                       (upstreamre nem adunk be semmit – döntés 2026-10-13)
#   owned_files         csak a forkban létező fájlok (ütközésmentesek)
#   hooks               upstream fájlok, amelyekbe a funkció belenyúl (ütközési kockázat)
#   cli / config / env  új CLI-opciók, config-kulcsok, környezeti változók
#   commits             commitok a custom/rebased-2026-09 ágon (alap: upstream 1170b048e8)
#   upstream_equivalent upstream megfelelő, ha van
#   used_by             a www alkalmazás hivatkozásai (null = jelenleg nem használt)
#   test                regressziós teszt (null = nincs még)
#   notes               nyitott kérdések, döntések
#
# Döntések: 2026-10-13 (lásd a decision mezőket).
# Állapot: 2026-10-13, ág custom/rebased-2026-09 @ 4d976bac18. Kódcímkék még NINCSENEK elhelyezve.

# Szinkron-beállítások – a fork/tools scriptek olvassák.
sync:
  upstream_remote: upstream
  upstream_branch: main
  fork_remote: origin
  fork_branch: custom/rebased-2026-09   # a fork fő ága; sikeres szinkron után az új ágra frissítendő
  cadence_days: 30            # ennyi nap után ajánlja fel a session-status a szinkron-riportot
  ignore:                     # ezek az upstream változások nem jelennek meg a riportban
    - "resources/profiles/**" # kivéve: profiles-vendor-prune keep + keep_upstream
    - "localization/**"
    - "resources/i18n/**"
    - ".github/**"
    - ".claude/**"
    - ".agents/**"
    - "doc/**"
    - "docs/**"
    - "sandboxes/**"
  protected:                  # csak kifejezett felhasználói utasításra módosítható
    - "resources/profiles/Ratrig/**"
    - "resources/profiles/Ratrig.json"

features:

  # ---------------------------------------------------------------- CLI

  - id: cli-preset-resolver
    name: CLI user-profil 'inherits' lánc feloldása + hiányzó 'type' kikövetkeztetése a mappanévből
    status: fork-only
    owned_files: [src/libslic3r/CliPresetResolver.cpp, src/libslic3r/CliPresetResolver.hpp]
    hooks: [src/OrcaSlicer.cpp, src/libslic3r/CMakeLists.txt]
    commits: [001591cade]
    upstream_equivalent: "OrcaSlicer.cpp resolve_preset + PresetBundle::resolve_preset_config / resolve_preset_config_type (#15953, #16038, #16047, #15693)"
    decision: "2026-10-13: a saját resolver marad (egyelőre)."
    used_by: null
    test: null
    notes: >
      Rebase-szabály: a saját CliPresetResolver marad, az upstream resolve_preset nem váltja ki.
      A 2026-10-13-i próba-rebase ezt rosszul oldotta fel (az upstream maradt) – újra kell csinálni.
      A saját megoldás 'system/' és 'user/' testvérmappákat is bejár (max. 6 szint felfelé).

  - id: cli-idex-multicolor
    name: CLI többszínű szeletelés IDEX / harmadik féltől származó több-extruderes gépen
    status: fork-only
    owned_files: []
    hooks: [src/OrcaSlicer.cpp, src/libslic3r/PrintConfig.cpp]
    cli: [--filament-colour]
    config: [filament_colour (CLIMisc)]
    commits: [001591cade, 84b69f170a]
    upstream_equivalent: "részben: #15636 (GUI mixed filament szabályok CLI-ben), #15639, #16157, #16247"
    decision: "2026-10-13: mindenképp a miénk marad."
    used_by: [routes/api_routes.py run_machine_process (--filament-colour)]
    test: null
    notes: >
      Tartalma: extruder_type / nozzle_volume_type szintézis, ha a gépprofil nem adja meg
      (DynamicPrintConfig::update_values_to_printer_extruders_for_multiple_filaments);
      printer_extruder_id / printer_extruder_variant alapértékek + set_num_extruders a CLI-ben;
      helykitöltő filament-színek, ha nincs megadva; per-filament vektorok átméretezése
      (filament_is_support, *_retraction_distances_when_cut, *_long_retractions_when_cut).
      Rebase után ellenőrizni kell, melyik részt fedi le már az upstream.

  - id: cli-extra-options
    name: CLI flush-szorzó és objektumtávolság felülírása
    status: fork-only
    hooks: [src/OrcaSlicer.cpp, src/libslic3r/PrintConfig.cpp]
    cli: [--flushing-multiplier, --object-distance]
    config: [flushing_multiplier (CLIMisc), object_distance (CLIMisc)]
    commits: [84b69f170a]
    decision: "2026-10-13: marad; jelenleg nem használt, de szükség lehet rá."
    used_by: null
    test: null

  - id: cli-pipe-logging
    name: CLI log fájlba (PID-enként) és tömör PROGRESS sorok stdout-ra; pipe-deadlock megelőzés párhuzamos futtatásnál
    status: fork-only
    hooks: [src/OrcaSlicer.cpp]
    env: [HOME]
    commits: [84b69f170a]
    used_by: [routes/api_routes.py (subprocess.Popen PIPE)]
    test: null
    notes: A www/Flask subprocess.Popen PIPE használatához készült.

  - id: cli-load-project-json
    name: --load-settings elfogad teljes projekt-config JSON-t (from=project, "Export All Configs")
    status: fork-only
    hooks: [src/OrcaSlicer.cpp]
    cli: [--load-settings]
    commits: [31cd1e6740]
    used_by: null
    test: null

  - id: cli-gcode-stats
    name: --gcode-stats akció – idő/filament újraszámolása kész G-code-ból újraszeletelés nélkül
    status: fork-only
    hooks: [src/OrcaSlicer.cpp, src/OrcaSlicer.hpp, src/libslic3r/PrintConfig.cpp]
    cli: [--gcode-stats, --gcode-stats-out]
    config: [gcode_stats (CLIActions), gcode_stats_out (CLIMisc)]
    commits: [5ff243f626]
    used_by: [utils/reslice_free_recalc.py, config.py]
    test: null

  - id: cli-thumbnail-gl
    name: Headless CLI thumbnail-renderelés (korai GL-inicializálás, X11-kényszer Wayland nélkül, wxGetApp-mentes shader-választás)
    status: fork-only
    hooks: [src/OrcaSlicer.cpp, src/slic3r/GUI/GLShadersManager.cpp]
    env: [XDG_RUNTIME_DIR, WAYLAND_DISPLAY]
    commits: [84b69f170a, 49607d49f4]
    upstream_equivalent: "részben: upstream GL 3.3 context + fallback a CLI thumbnailnél (2026-10)"
    test: null
    notes: A 49607d49f4 javította a GL kontextus-verziót (3.2); az upstream azóta 3.3-at kér, fallbackkel.

  - id: fix-partplate-model-pointer
    name: PartPlate/PartPlateList::set_model – modellmutató frissítése m_models újrafoglalás után (--assemble)
    status: fork-only
    hooks: [src/slic3r/GUI/PartPlate.hpp]
    commits: [84b69f170a]
    test: null

  - id: fix-glmodel-cli-guard
    name: GLModel::init_from – wxGetApp() védelem CLI módban
    status: superseded
    hooks: [src/slic3r/GUI/GLModel.cpp]
    commits: [ebd9b59d8e]
    upstream_equivalent: "upstream/main ugyanezt a védelmet tartalmazza (2026-10)"
    test: null
    notes: A következő rebase-nél kiesik (üres commit).

  # ---------------------------------------------------------------- Arrange

  - id: arrange-fast
    name: Gyors, befoglaló-téglalap alapú arrange téglalap alakú tálcára + --arrange-info (csak arrange, kiírás szövegben/JSON-ban)
    status: fork-only
    owned_files: [src/libslic3r/ArrangeFast.cpp, src/libslic3r/ArrangeFast.hpp]
    hooks: [src/libslic3r/Arrange.cpp, src/libslic3r/Arrange.hpp, src/libslic3r/CMakeLists.txt, src/OrcaSlicer.cpp, src/libslic3r/PrintConfig.cpp]
    cli: [--arrange-mode, --arrange-info, --arrange-info-format, --arrange-info-file]
    config: [arrange_mode (CLIMisc, alapértelmezés "fast"), arrange_info (CLIActions), arrange_info_format, arrange_info_file]
    commits: [4d976bac18]
    used_by: null
    test: null
    notes: >
      Az alapértelmezett CLI mód "fast" → az upstream CLI arrange viselkedése nálunk eltér.
      Nyitott: upstream is_belt (#14394), prime tower foglalás (#15837), --align-to-y-axis (#15836),
      alapból tiltott forgatás (#15033) kezelése.

  # ---------------------------------------------------------------- G-code / export

  - id: moves-sidecar
    name: Bináris <gcode>.moves sidecar (OSMV v1) minden exportált G-code mellé a www gcode2gltf pipeline-hoz
    status: fork-only
    hooks: [src/libslic3r/GCode/GCodeProcessor.cpp, src/libslic3r/GCode/GCodeProcessor.hpp, src/libslic3r/GCode.cpp, src/libslic3r/Print.cpp]
    env: [ORCA_SKIP_MOVES_EXPORT]
    commits: [84b69f170a, c5e6580b07]
    used_by: [gcode2gltf.py, utils/lab_imports.py]
    test: null

  - id: parallel-gcode-export
    name: --parallel – darabolt, többszálú, rétegenkénti G-code szöveg-generálás
    status: fork-only
    hooks: [src/libslic3r/GCode.cpp, src/libslic3r/GCode.hpp, src/libslic3r/GCodeWriter.hpp, src/libslic3r/Print.cpp, src/libslic3r/Print.hpp, src/libslic3r/PrintConfig.cpp, src/OrcaSlicer.cpp]
    cli: [--parallel]
    config: [parallel (CLIMisc)]
    commits: [49607d49f4, 4d976bac18]
    decision: "2026-10-13: a saját megoldás marad."
    used_by: [routes/api_routes.py run_machine_process (--parallel)]
    test: null
    notes: >
      Rebase-szabály: a saját implementáció marad; az upstream export-változásaihoz igazítani kell.
      Legnagyobb rebase-kockázat (GCode::clone_for_parallel_chunk az upstream export-állapotát másolja).
      A 4d976bac18 a tálca-offset javítást tartalmazza a klónban.
      Upstream azóta: export 4–26% gyorsítás (#16026, #16028, #16031, #16050, #16108, #16167),
      IMEX offset (set_gcode_offset_with_imex_shift), iXex (#13086) – a klónnak ezeket is át kell vennie.

  - id: slicedata-cache
    name: --export-slicedata / --load-slicedata bináris, párhuzamos (de)szerializáció
    status: fork-only
    hooks: [src/libslic3r/Print.cpp]
    commits: [888405cb6e, 58b69357d0, 5625901be6]
    decision: "2026-10-13: marad."
    used_by: [routes/api_routes.py run_machine_process (--export-slicedata / --load-slicedata), _slicedata_cache]
    test: null
    notes: >
      Referencia (PLA) szeletelés geometriáját menti, a többi filament ugyanarra a kombinációra
      visszatölti újraszeletelés helyett. Bináris, rétegenként/régiónként párhuzamos formátum.

