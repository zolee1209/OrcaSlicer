  # ---------------------------------------------------------------- Arrange

  - id: arrange-fast
    name: Gyors, befoglaló-téglalap alapú arrange téglalap alakú tálcára + --arrange-info (csak arrange, kiírás szövegben/JSON-ban)
    status: fork-only
    owned_files: [src/libslic3r/ArrangeFast.cpp, src/libslic3r/ArrangeFast.hpp]
    hooks: [src/libslic3r/Arrange.cpp, src/libslic3r/Arrange.hpp, src/libslic3r/CMakeLists.txt, src/OrcaSlicer.cpp, src/libslic3r/PrintConfig.cpp]
    cli: [--arrange-mode, --arrange-info, --arrange-info-format, --arrange-info-file]
    config: [arrange_mode (CLIMisc, alapértelmezés "fast"), arrange_info (CLIActions), arrange_info_format, arrange_info_file]
    commits: [477f05313c, b12e992347]
    used_by: null
    test: null
    notes: >
      Az alapértelmezett CLI mód "fast" → az upstream CLI arrange viselkedése nálunk eltér.
      2026-10 igazítás: belt nyomtató → nest (fallback); excluded/nonprefered régiók akadályként minden
      plate-en (korábban nest-fallback); túlcsorduló plate-ek megkapják az első plate virtuális régióit;
      prime tower: ha egy plate többanyagúvá válik és nincs rajta torony, a tower-sablon (a plate saját tornya, különben az első)
      lefoglalódik, ha nem ütközik; --align-to-y-axis: forgatásnál a 0° az elsődleges, 90° csak tartalék;
      #15033 (forgatás csak --allow-rotations-zel) az allow_rotations paraméteren át érvényes.
      A prime tower feltételes akadály: a CLI (#15837) minden plate-re ad tornyot, ha bármelyik többanyagú,
      de egyanyagú plate-en nincs torony → ott nem foglal helyet (pl. A x120 + B x5: 98 + 22/5 tornnyal, korábban 97 + 23/5).

  # ---------------------------------------------------------------- G-code / export

  - id: moves-sidecar
    name: Bináris <gcode>.moves sidecar (OSMV v1) minden exportált G-code mellé a www gcode2gltf pipeline-hoz
    status: fork-only
    hooks: [src/libslic3r/GCode/GCodeProcessor.cpp, src/libslic3r/GCode/GCodeProcessor.hpp, src/libslic3r/GCode.cpp, src/libslic3r/Print.cpp]
    env: [ORCA_SKIP_MOVES_EXPORT]
    commits: [cdea9ce03d, 57546d135f]
    used_by: [gcode2gltf.py, utils/lab_imports.py]
    test: null

  - id: parallel-gcode-export
    name: --parallel – darabolt, többszálú, rétegenkénti G-code szöveg-generálás
    status: fork-only
    hooks: [src/libslic3r/GCode.cpp, src/libslic3r/GCode.hpp, src/libslic3r/GCodeWriter.hpp, src/libslic3r/Print.cpp, src/libslic3r/Print.hpp, src/libslic3r/PrintConfig.cpp, src/OrcaSlicer.cpp]
    cli: [--parallel]
    config: [parallel (CLIMisc)]
    env: [ORCA_PARALLEL_WAVES]
    commits: ["5442021239", 477f05313c, 22d8bb68d0]
    decision: "2026-10-13: a saját megoldás marad."
    used_by: [routes/api_routes.py run_machine_process (--parallel)]
    test: null
    notes: >
      Rebase-szabály: a saját implementáció marad; az upstream export-változásaihoz igazítani kell.
      Legnagyobb rebase-kockázat (GCode::clone_for_parallel_chunk az upstream export-állapotát másolja).
      A 4d976bac18 a tálca-offset javítást tartalmazza a klónban.
      2026-10 igazítás: a klón a fő worker writer-offsetjét kapja (plate origin + IMEX shift),
      átveszi az IMEX parallel mode / head-filament map állapotot, toolchange_count >= 1;
      #16050 overhang precompute rétegenként a chunkban; a chunk első rétege előtt az estimator
      az objektumok alsó rétegével előkészül (különben az első réteg teljes egészében overhangnak
      számított → F1500, ez okozta a korábbi kb. +18% időbecslés-eltérést); belt nyomtató → soros út.
      Az upstream többi export-gyorsítása (#16026, #16028, #16031, #16108, #16167) a közös kódúton automatikusan érvényes.
      Mérés 2026-10-13 (referencia: Benchy x100, plate 1 = 98 db): serial vs --parallel becsült idő ±1 s
      (korábban +18%); G-code fázis 57,0 s → 53,4 s. A nyereség kicsi, mert a kimeneti stream
      GCodeProcessor-a (időbecslés + .moves) egyszálú, és a serial pipeline ezt már átfedi a generálással.
      2026-10-16 profil (nyitott javítási lehetőségek): fork/perf/2026-10-16-gcode-phase-profile.md.
      2026-10-16 rendezett pipeline: a chunkok K hullámban (szálak × K chunk, min. 2 réteg) készülnek
      tbb::parallel_pipeline-ban, és sorrendben, azonnal mennek a GCodeProcessorba (átfedés a generálással);
      a progress a kiírásból jön (nincs néma farok az utolsó réteg után); a kész klónok azonnal felszabadulnak.
      ORCA_PARALLEL_WAVES (alap 3; 1 = a régi egyhullámú elrendezés). Teszt: Benchy x100 becsült idő
      soros +3 s / 2 nap 10 óra; többszínű IDEX (Benchy x120 ABS + 1.stl x5 PETG) T0/T1 és torony azonos, +2 s.

