  # ---------------------------------------------------------------- GUI

  - id: gui-idex-nozzle-combo
    name: Egységes fúvóka-combo mindkét fúvókát állítja nem-BBL kétextruderes (IDEX) gépen
    status: fork-only
    hooks: [src/slic3r/GUI/Plater.cpp]
    commits: [84b69f170a]
    decision: "2026-10-13: marad; a mainline viselkedését a felhasználó külön telepítésen ellenőrzi."
    used_by: null
    test: null
    notes: >
      A 2026-10-13-i próba-rebase-ben az eseménykezelő része kimaradt (az upstream variant-választó maradt) – újra kell csinálni.
      Nyitott: a mainline IDEX combo-viselkedésének ellenőrzése (felhasználó).

  # ---------------------------------------------------------------- Build

  - id: build-native
    name: build_linux.sh -x – natív CPU-optimalizált build (skylake-avx512, clang, LTO, strip), dinamikus TBB + bundle
    status: fork-only
    hooks: [build_linux.sh, deps/TBB/TBB.cmake, src/dev-utils/platform/unix/build_linux_image.sh.in]
    commits: [001591cade]
    test: null
    notes: Leírás a BUILD_OPTIMIZED.md és a BUILD_PERFORMANCE_UBUNTU26.md fájlban.

  - id: build-jemalloc
    name: jemalloc allokátor linkelése (-l:libjemalloc.so.2), ha elérhető
    status: fork-only
    hooks: [build_linux.sh]
    commits: [c5e6580b07]
    test: null

  # ---------------------------------------------------------------- Profilok / eszközök

  - id: profiles-vendor-prune
    name: Csak saját profilok a forkban – minden más gyártó profilja törölve a gitből
    status: fork-only
    hooks: [resources/profiles, resources/images/amshub_N6.png]
    commits: [dd41308900]
    decision: "2026-10-13: a fork gitjében csak saját profilok legyenek; más gyártó profiljaival nem akarunk találkozni."
    used_by: null
    test: null
    keep: [Ratrig, Ratrig.json]                      # saját, szigorúan a fork verziója
    keep_upstream: [OrcaFilamentLibrary, OrcaFilamentLibrary.json, Custom, Custom.json]  # 2026-10-13: maradnak, upstream verzióban, automatikus frissítéssel
    notes: >
      Rebase-szabály: a resources/profiles alatti modify/delete és rename/delete ütközéseket
      script oldja fel törléssel (AI nélkül). Az upstream által hozzáadott új gyártói mappákat
      rebase után ugyanez a script törli egy [fork:profiles-vendor-prune] commitban.
      A keep lista tartalmához soha nem nyúl.
      keep_upstream: a telepített rendszer ezeket a Ratrig mellett betölti, a PresetBundle az
      OrcaFilamentLibrary-t alapkönyvtárként kezeli; rebase-nél az upstream változásai ütközés nélkül átjönnek.
      A 2026-10-13-i állapotban a törlés hiányos volt (41 gyártómappa maradt részben).

  - id: profiles-ratrig
    name: Ratrig profilrendszer – fúvóka-variánsok, IDEX COPY/MIRROR mód, filament-kalibráció, egyedi setting_id-k
    status: fork-only
    owned_files: []
    hooks: [resources/profiles/Ratrig, resources/profiles/Ratrig.json, resources/profiles/OrcaFilamentLibrary]
    commits: [a234a984dd, c8838b1b31, b80db00a81]
    test: null
    decision: "2026-10-13: SZIGORÚAN saját fájlok. Nem törölhetők, és kifejezett utasítás nélkül nem módosíthatók."
    notes: >
      Rebase-szabály: a Ratrig fájlok mindig pontosan a fork verzióját kapják (git checkout <fork-tip> -- resources/profiles/Ratrig resources/profiles/Ratrig.json),
      upstream változás soha nem olvad bele, automatikusan sem.
      Az egyedi (nem upstreamből származó) profilok is itt vannak: 496 hozzáadott fájl.

  - id: tools-ratrig
    name: Ratrig profilkezelő és javító scriptek
    status: fork-only
    owned_files: [scripts/ratrig_profile_tool.py, scripts/assign_vendor_setting_ids.py, fix_ratrig_profiles.py, regenerate_process_compat.py]
    commits: [a234a984dd, b80db00a81]
    test: null
    notes: A fix_ratrig_profiles.py és a regenerate_process_compat.py egyszeri javító script; áthelyezhetők fork/tools/ alá.

  # ---------------------------------------------------------------- Fork-karbantartás

  - id: fork-meta
    name: Fork-karbantartási eszközök – funkciólista, scriptek, Copilot utasítás és skill
    status: fork-only
    owned_files: [fork, .github/instructions/orca-fork.instructions.md, .github/skills/orca-fork]
    hooks: [.gitignore]
    commits: [4d976bac18]
